name: Release

# Builds a production Windows installer on a tag push and publishes it as a
# GitHub Release against the repo's releases (FINAL, not draft — required for
# electron-updater to pick it up). No secrets are stored in the repository;
# publishing uses the built-in GitHub Actions token.
#
# Tag format: v<semver>  e.g. v1.0.1 — the tag must match package.json version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      - name: Type-check and test
        run: npm run typecheck && npm test

      # Code signing (optional). If the CSC_LINK_B64 secret is set, the PFX is
      # decoded into a temp file and CSC_LINK/CSC_KEY_PASSWORD tell
      # electron-builder to sign the installer. Without it the build stays
      # unsigned (current behaviour). No certificate is stored in the repo.
      - name: Decode signing certificate
        shell: pwsh
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK_B64)) {
            Write-Host "No CSC_LINK_B64 secret set - building unsigned"
          } else {
            $bytes = [Convert]::FromBase64String($env:CSC_LINK_B64)
            $pfxPath = Join-Path $env:RUNNER_TEMP "financial-encoder-signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $bytes)
            Write-Host "CSC_LINK=$pfxPath" >> $env:GITHUB_ENV
            Write-Host "Decoded signing certificate ($($bytes.Length) bytes) to $pfxPath"
          }

      # electron-builder can race and create two releases with the same tag
      # (two parallel publisher instances). Make publishing deterministic:
      # delete any stale duplicates for this tag, then pre-create the single
      # target release so electron-builder only ever uploads into it.
      - name: Remove stale releases for this tag
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $token = $env:GITHUB_TOKEN
          $h = @{ Authorization = "Bearer $token"; "Accept" = "application/vnd.github+json"; "User-Agent" = "fe-release-workflow" }
          $rels = Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $stale = $rels | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME }
          foreach ($r in $stale) {
            Invoke-RestMethod -Method Delete -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($r.id)"
            Write-Host "deleted stale release id $($r.id)"
          }

      - name: Pre-create the target release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $token = $env:GITHUB_TOKEN
          $h = @{ Authorization = "Bearer $token"; "Accept" = "application/vnd.github+json"; "User-Agent" = "fe-release-workflow" }
          $existing = $null
          try { $existing = Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" } catch { }
          if ($null -eq $existing) {
            $notes = Get-Content -Raw RELEASE_NOTES.md
            $body = @{ tag_name = $env:GITHUB_REF_NAME; name = $env:GITHUB_REF_NAME; body = $notes } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Headers $h -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Body $body
            Write-Host "pre-created release $env:GITHUB_REF_NAME"
          } else {
            Write-Host "release $env:GITHUB_REF_NAME already exists"
          }

      - name: Build, package and publish to GitHub Releases
        run: npm run release:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Remove the certificate from the runner once the build is done.
      - name: Cleanup signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "financial-encoder-signing.pfx"
          if (Test-Path $pfxPath) {
            Remove-Item $pfxPath -Force
            Write-Host "Removed signing certificate"
          }

      - name: Verify installer signature
        if: always()
        shell: pwsh
        run: |
          $setup = Get-ChildItem "release" -Filter "Financial-Encoder-Setup-*.exe" | Select-Object -First 1
          if ($setup) {
            $sig = Get-AuthenticodeSignature $setup.FullName
            Write-Host "Setup: $($setup.Name)"
            Write-Host "Signature status: $($sig.Status)"
            Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          }