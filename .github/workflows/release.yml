name: Release

# Builds a production Windows installer on a tag push and publishes it as a
# GitHub Release against the repo's releases (FINAL, not draft — required for
# electron-updater to pick it up). No secrets are stored in the repository;
# publishing uses the built-in GitHub Actions token.
#
# Tag format: v<semver>  e.g. v1.0.1 — the tag must match package.json version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps

      # Bundle the offline PaddleOCR runtime + models into the installer. The
      # runtime is a git-ignored build artifact provisioned at build time; without
      # this step the packaged app would fall back to tesseract.js for OCR.
      - name: Cache PaddleOCR runtime and models
        uses: actions/cache@v4
        with:
          path: |
            ocr-runtime
            ocr-sidecar/models
          key: ocr-runtime-${{ runner.os }}-${{ hashFiles('scripts/setup-ocr-runtime.ps1') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Provision PaddleOCR runtime (offline OCR)
        run: npm run ocr:setup

      - name: Verify PaddleOCR runtime
        shell: pwsh
        run: |
          if (-not (Test-Path "ocr-runtime/python.exe")) { throw "ocr-runtime/python.exe missing" }
          if (-not (Test-Path "ocr-sidecar/models")) { throw "OCR models missing" }
          Write-Host "PaddleOCR runtime and models present."

      - name: Type-check and test
        run: npm run typecheck && npm test

      # Code signing (optional). If the CSC_LINK_B64 secret is set, the PFX is
      # decoded into a temp file and CSC_LINK/CSC_KEY_PASSWORD tell
      # electron-builder to sign the installer. Without it the build stays
      # unsigned (current behaviour). No certificate is stored in the repo.
      - name: Decode signing certificate
        shell: pwsh
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK_B64)) {
            Write-Host "No CSC_LINK_B64 secret set - building unsigned"
          } else {
            $bytes = [Convert]::FromBase64String($env:CSC_LINK_B64)
            $pfxPath = Join-Path $env:RUNNER_TEMP "financial-encoder-signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $bytes)
            Write-Host "CSC_LINK=$pfxPath" >> $env:GITHUB_ENV
            Write-Host "Decoded signing certificate ($($bytes.Length) bytes) to $pfxPath"
          }

      # Build and package only. The release is created and published in a later
      # step so that a failed build (or upload) can never leave an empty,
      # published release that breaks auto-update for every installed app.
      - name: Build and package installer
        run: npm run release
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem "release" -Filter "Financial-Encoder-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $blockmap = Get-ChildItem "release" -Filter "*.exe.blockmap" -ErrorAction SilentlyContinue | Select-Object -First 1
          $latest = Join-Path "release" "latest.yml"
          if (-not $setup) { throw "Installer (.exe) was not produced." }
          if (-not $blockmap) { throw "Blockmap was not produced." }
          if (-not (Test-Path $latest)) { throw "latest.yml was not produced." }
          Write-Host "Artifacts:"
          Write-Host "  $($setup.Name) ($($setup.Length) bytes)"
          Write-Host "  $($blockmap.Name) ($($blockmap.Length) bytes)"
          Write-Host "  latest.yml ($((Get-Item $latest).Length) bytes)"

      # Publish with gh instead of electron-builder's own publisher, which can
      # race and create duplicate releases for one tag. The release is created
      # as a draft, assets are uploaded, and only then is it published - so an
      # upload failure stays invisible to the updater instead of breaking it.
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw "The Publish step requires a version tag (got ref type '$env:GITHUB_REF_TYPE'). Push a vX.Y.Z tag to release."
          }
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Removing existing release for $tag"
            gh release delete $tag --yes
          }
          $assets = @()
          $assets += (Get-ChildItem "release" -Filter "Financial-Encoder-Setup-*.exe").FullName
          $assets += (Get-ChildItem "release" -Filter "*.exe.blockmap").FullName
          $assets += (Resolve-Path "release/latest.yml").Path
          gh release create $tag @assets --draft --title $tag --notes-file RELEASE_NOTES.md
          gh release edit $tag --draft=false --latest
          Write-Host "Published release $tag"

      # Remove the certificate from the runner once the build is done.
      - name: Cleanup signing certificate
        if: always()
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "financial-encoder-signing.pfx"
          if (Test-Path $pfxPath) {
            Remove-Item $pfxPath -Force
            Write-Host "Removed signing certificate"
          }

      - name: Verify installer signature
        if: always()
        shell: pwsh
        run: |
          $setup = Get-ChildItem "release" -Filter "Financial-Encoder-Setup-*.exe" | Select-Object -First 1
          if ($setup) {
            $sig = Get-AuthenticodeSignature $setup.FullName
            Write-Host "Setup: $($setup.Name)"
            Write-Host "Signature status: $($sig.Status)"
            Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          }